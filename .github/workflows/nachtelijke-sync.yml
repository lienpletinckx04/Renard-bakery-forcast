name: Nachtelijke sync

# Odoo -> canoniek -> Supabase, elke nacht. Zie scripts/nachtelijke_sync.py
# voor de ketting zelf (migraties, poortwachter, extract, canoniek, laden,
# contract, contract laden) -- deze workflow doet niets anders dan die ketting
# de juiste omgeving geven en 's nachts starten.
#
# Vereiste repository secrets (Settings -> Secrets and variables -> Actions):
#   ODOO_URL, ODOO_DB, ODOO_USER, ODOO_API_KEY, SUPABASE_DB_URL
#
# 01:30 UTC = 02:30 of 03:30 Brusselse tijd, afhankelijk van zomertijd. Dat is
# bewust ná middernacht Brusselse tijd in alle gevallen: de dag die net
# gesloten is, staat dan al volledig in Odoo.

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch: {}

# `issues: write` draagt de faalmelding onderaan. Zonder deze regel faalt die
# stap zelf met een 403 en verdwijnt de storing in een logboek dat niemand
# opent -- precies het stille falen dat de melding moest voorkomen.
permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Python-omgeving opzetten
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: .env schrijven uit de repository secrets
        # bakkerij/sources/odoo_client.py vergt een echt bestand op schijf
        # (een ontbrekende .env is daar bewust fataal, zie de moduledocstring)
        # -- omgevingsvariabelen alleen volstaan niet. Dit bestand leeft nooit
        # langer dan de job: de runner wordt na afloop weggegooid.
        #
        # Via `env:` en Python, niet via een shell-heredoc: een wachtwoord met
        # een `$`, een backtick of een `!` erin wordt door de shell stilzwijgend
        # vervangen of afgekapt, en dan faalt de verbinding met een melding die
        # naar het wachtwoord wijst in plaats van naar deze regel.
        env:
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_USER: ${{ secrets.ODOO_USER }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib

          NAMEN = ["ODOO_URL", "ODOO_DB", "ODOO_USER", "ODOO_API_KEY", "SUPABASE_DB_URL"]
          regels = [f"{naam}={os.environ.get(naam, '').strip()}" for naam in NAMEN]
          pathlib.Path(".env").write_text("\n".join(regels) + "\n", encoding="utf-8")

          # Alleen of ze gevuld zijn, nooit wát erin staat.
          leeg = [naam for naam in NAMEN if not os.environ.get(naam, "").strip()]
          if leeg:
              raise SystemExit(
                  "Deze secrets zijn leeg of ontbreken: " + ", ".join(leeg) + ".\n"
                  "Zet ze onder Settings -> Secrets and variables -> Actions."
              )
          print(f"Alle {len(NAMEN)} secrets zijn aanwezig.")
          PY

      - name: Verbindingsstring toetsen vóór het zware werk
        # De ketting begint met een extract van ruim een miljoen bonregels en
        # schrijft pas daarna naar Postgres. Een DSN die niet deugt, viel dus
        # pas op ná dat extract. Deze stap draait dezelfde pure toets die de
        # ETL gebruikt (bakkerij/db/verbinding.py) en faalt binnen een seconde,
        # met de reden erbij. De string zelf komt nooit in het logboek.
        run: |
          .venv/bin/python - <<'PY'
          import sys

          sys.path.insert(0, ".")
          from bakkerij.db.verbinding import controleer_dsn, normaliseer_dsn
          from bakkerij.omgeving import laad_env
          import os

          laad_env()
          bezwaren = controleer_dsn(normaliseer_dsn(os.environ.get("SUPABASE_DB_URL", "")))
          if bezwaren:
              print("SUPABASE_DB_URL deugt niet:")
              for bezwaar in bezwaren:
                  print(f"  - {bezwaar}")
              raise SystemExit(1)
          print("SUPABASE_DB_URL heeft de juiste vorm.")
          PY

      - name: Nachtelijke sync
        run: make sync

      - name: Faalmelding als issue
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nachtelijke sync gefaald - ${new Date().toISOString().slice(0, 10)}`,
              body: `De nachtelijke sync (run ${context.runId}) is gefaald. ` +
                    `Logs: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
                    `De databank draagt hierdoor mogelijk niet de jongste dag. ` +
                    `\`etl_run\` (bron nachtelijke-sync) heeft de reden.`,
              labels: ["nachtelijke-sync", "storing"],
            })
