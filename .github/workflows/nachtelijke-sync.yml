name: Nachtelijke sync

# Odoo -> canoniek -> Supabase, elke nacht. Zie scripts/nachtelijke_sync.py
# voor de ketting zelf (migraties, poortwachter, extract, canoniek, laden,
# contract, contract laden) -- deze workflow doet niets anders dan die ketting
# de juiste omgeving geven en 's nachts starten.
#
# Vereiste repository secrets (Settings -> Secrets and variables -> Actions):
#   ODOO_URL, ODOO_DB, ODOO_USER, ODOO_API_KEY, SUPABASE_DB_URL
#
# 01:30 UTC = 02:30 of 03:30 Brusselse tijd, afhankelijk van zomertijd. Dat is
# bewust ná middernacht Brusselse tijd in alle gevallen: de dag die net
# gesloten is, staat dan al volledig in Odoo.

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      krimp_ok:
        description: >-
          Sta toe dat het contract KRIMPT. Alleen aanvinken als een kanaal of
          een winkel er bewust uit is (bv. TGTG, 18 sep 2026). Anders weigert
          de contractlader, en terecht.
        type: boolean
        default: false

# `issues: write` draagt de faalmelding onderaan. Zonder deze regel faalt die
# stap zelf met een 403 en verdwijnt de storing in een logboek dat niemand
# opent -- precies het stille falen dat de melding moest voorkomen.
permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Python-omgeving opzetten
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: .env schrijven uit de repository secrets
        # bakkerij/sources/odoo_client.py vergt een echt bestand op schijf
        # (een ontbrekende .env is daar bewust fataal, zie de moduledocstring)
        # -- omgevingsvariabelen alleen volstaan niet. Dit bestand leeft nooit
        # langer dan de job: de runner wordt na afloop weggegooid.
        #
        # Via `env:` en Python, niet via een shell-heredoc: een wachtwoord met
        # een `$`, een backtick of een `!` erin wordt door de shell stilzwijgend
        # vervangen of afgekapt, en dan faalt de verbinding met een melding die
        # naar het wachtwoord wijst in plaats van naar deze regel.
        env:
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_USER: ${{ secrets.ODOO_USER }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          # Geen secrets: de projectverwijzing staat al publiek in
          # NEXT_PUBLIC_SUPABASE_URL en de poolerhost volgt uit de regio. Ze
          # staan hier zodat de verbindingsstring uit één wachtwoord op te
          # bouwen is -- zie de toelichting hieronder.
          DB_GEBRUIKER: postgres.ngerseztiilxwkahctgu
          DB_HOST: aws-0-eu-north-1.pooler.supabase.com
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import urllib.parse

          def schoon(naam: str) -> str:
              return os.environ.get(naam, "").strip()

          # TWEE WEGEN NAAR DEZELFDE VERBINDINGSSTRING, en de tweede bestaat
          # omdat de eerste in de praktijk misging. SUPABASE_DB_URL vergt dat
          # iemand met de hand een URI samenstelt: gebruiker met projectref,
          # poort 5432 en niet 6543, `?sslmode=require` erachter (de knop
          # "Copy" in Supabase laat die weg), en een wachtwoord dat
          # URL-geëncodeerd hoort te zijn zodra er een @ of / in staat. Elk van
          # die vier is één keer fout te doen, en de foutmelding wijst dan naar
          # de string en niet naar de stap die hem maakte.
          #
          # SUPABASE_DB_PASSWORD draagt daarom alleen het wachtwoord, precies
          # zoals Supabase het na een reset toont. De rest staat hierboven en
          # verandert niet. Staat SUPABASE_DB_URL gevuld, dan wint die: wie
          # bewust een andere host of poort kiest, wordt niet overruled.
          import sys

          sys.path.insert(0, ".")
          from bakkerij.db.verbinding import controleer_dsn, normaliseer_dsn

          def uit_wachtwoord() -> str:
              wachtwoord = urllib.parse.quote(schoon("SUPABASE_DB_PASSWORD"), safe="")
              return (
                  f"postgresql://{schoon('DB_GEBRUIKER')}:{wachtwoord}"
                  f"@{schoon('DB_HOST')}:5432/postgres?sslmode=require"
              )

          dsn = normaliseer_dsn(schoon("SUPABASE_DB_URL"))
          bron = "SUPABASE_DB_URL"

          # Een SUPABASE_DB_URL die niet deugt wordt opzijgezet als er een
          # wachtwoord ligt waarmee het wél kan. Niet stilletjes: de bezwaren
          # gaan mee het logboek in, zodat een bewust gezette URL die stuk is
          # even zichtbaar blijft als een URL die er nooit was.
          if dsn and controleer_dsn(dsn) and schoon("SUPABASE_DB_PASSWORD"):
              print("SUPABASE_DB_URL is gezet maar deugt niet:")
              for bezwaar in controleer_dsn(dsn):
                  print(f"  - {bezwaar}")
              print("  -> genegeerd; de string wordt uit SUPABASE_DB_PASSWORD opgebouwd.")
              dsn = ""

          if not dsn and schoon("SUPABASE_DB_PASSWORD"):
              dsn = uit_wachtwoord()
              bron = "SUPABASE_DB_PASSWORD (string zelf samengesteld)"

          waarden = {naam: schoon(naam) for naam in
                     ["ODOO_URL", "ODOO_DB", "ODOO_USER", "ODOO_API_KEY"]}
          waarden["SUPABASE_DB_URL"] = dsn
          pathlib.Path(".env").write_text(
              "\n".join(f"{naam}={waarde}" for naam, waarde in waarden.items()) + "\n",
              encoding="utf-8",
          )

          # Alleen of ze gevuld zijn, nooit wát erin staat.
          leeg = [naam for naam, waarde in waarden.items() if not waarde]
          if leeg:
              raise SystemExit(
                  "Deze secrets zijn leeg of ontbreken: " + ", ".join(leeg) + ".\n"
                  "Zet ze onder Settings -> Secrets and variables -> Actions.\n"
                  "Voor de database volstaat SUPABASE_DB_PASSWORD (alleen het "
                  "wachtwoord); SUPABASE_DB_URL hoeft dan niet te bestaan."
              )
          print(f"Alle {len(waarden)} waarden zijn aanwezig. Database via: {bron}.")
          PY

      - name: Verbindingsstring toetsen vóór het zware werk
        # De ketting begint met een extract van ruim een miljoen bonregels en
        # schrijft pas daarna naar Postgres. Een DSN die niet deugt, viel dus
        # pas op ná dat extract. Deze stap draait dezelfde pure toets die de
        # ETL gebruikt (bakkerij/db/verbinding.py) en faalt binnen een seconde,
        # met de reden erbij. De string zelf komt nooit in het logboek.
        run: |
          .venv/bin/python - <<'PY'
          import sys

          sys.path.insert(0, ".")
          from bakkerij.db.verbinding import controleer_dsn, normaliseer_dsn
          from bakkerij.omgeving import laad_env
          import os

          laad_env()
          bezwaren = controleer_dsn(normaliseer_dsn(os.environ.get("SUPABASE_DB_URL", "")))
          if bezwaren:
              print("SUPABASE_DB_URL deugt niet:")
              for bezwaar in bezwaren:
                  print(f"  - {bezwaar}")
              raise SystemExit(1)
          print("SUPABASE_DB_URL heeft de juiste vorm.")
          PY

      - name: Nachtelijke sync
        # CONTRACT_KRIMP_OK staat hier bewust NIET vast aan. De beslissing van
        # 18 augustus 2026 (beslissingen.md) koos een omgevingsvariabele boven
        # een make-vlag met als reden: krimp hoort een bewuste, eenmalige
        # handeling van een mens te zijn en niet iets dat kan inslijten. Een
        # workflow_dispatch-invoer is precies dat -- iemand vinkt hem aan voor
        # één run. De cron kent geen inputs en draait dus altijd mét de wacht.
        env:
          CONTRACT_KRIMP_OK: ${{ inputs.krimp_ok && '1' || '' }}
        run: make sync

      - name: Faalmelding als issue
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nachtelijke sync gefaald - ${new Date().toISOString().slice(0, 10)}`,
              body: `De nachtelijke sync (run ${context.runId}) is gefaald. ` +
                    `Logs: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
                    `De databank draagt hierdoor mogelijk niet de jongste dag. ` +
                    `\`etl_run\` (bron nachtelijke-sync) heeft de reden.`,
              labels: ["nachtelijke-sync", "storing"],
            })
